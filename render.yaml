services:
  - type: web
    name: dpmdsc
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ADMIN_USERNAME
        value: "nareshdpm"
      - key: ADMIN_PASSWORD
        value: "7159"
      - key: ADMIN_PIN
        value: "7159"
